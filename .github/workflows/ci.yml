name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check apps services pipelines evaluation tests scripts
          ruff format --check apps services pipelines evaluation tests scripts
      - name: Type check
        run: mypy apps/api services pipelines evaluation
      - name: Test with coverage gate
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          pytest -m "not integration" \
            --cov=apps.api \
            --cov=services.matcher \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  evaluation:
    name: Model evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Evaluate sample benchmark
        run: |
          mkdir -p evaluation/results
          python -m evaluation.run \
            --catalog data/sample/catalog.csv \
            --offers data/sample/offers.jsonl \
            --output evaluation/results/sample-baseline.json \
            --check-thresholds
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: sample-baseline-results
          path: evaluation/results/sample-baseline.json

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialize providers
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, web, evaluation]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: catalogops-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: catalogops-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
