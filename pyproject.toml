[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires local infrastructure",
  "slow: comparatively expensive evaluation",
]

[tool.coverage.run]
branch = true
source = ["apps/api", "services", "pipelines", "evaluation"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services", "pipelines", "evaluation"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["data/", "artifacts/"]

